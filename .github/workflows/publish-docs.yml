name: Docs
on:
  push:
  release:
    types: [created]

jobs:
  docs-external:
    runs-on: ubuntu-slim
    if: github.server_url == 'https://github.com'
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.0.0
    - name: Sphinx build
      run: uv run --group docs sphinx-build -d .doctrees docs _build
    - uses: actions/upload-artifact@v4
      with:
        name: docs
        path: _build
        if-no-files-found: error
    - name: Publish to web
      if: github.event_name == 'release'
      run: |
        aws s3 sync _build "s3://$AWS_S3_BUCKET/$DEST_DIR" \
          --acl public-read --follow-symlinks --delete --exclude '.git/*'
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        DEST_DIR: ${{ vars.DEST_DIR }}
  docs-internal:
    runs-on: [self-hosted]
    if: github.server_url != 'https://github.com'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Sphinx build
      run: uv run --group docs sphinx-build -d .doctrees docs _build
    - uses: actions/upload-artifact@v3
      with:
        name: docs
        path: _build
        if-no-files-found: error
    - name: Publish to GitHub Pages
      if: github.event_name == 'release'
      run: |
        git fetch origin gh-pages
        git worktree add -B gh-pages ../gh-pages origin/gh-pages
        cd ../gh-pages
        rm -rf ./*
        cp -r "$GITHUB_WORKSPACE"/_build/. .
        touch .nojekyll
        git add -A
        if git diff --cached --quiet; then
          echo "No doc changes to publish"
          exit 0
        fi
        # gh-pages is a single rootless commit: no history to accumulate.
        git checkout -q --orphan gh-pages-new
        git add -A
        git -c user.name="github-actions[bot]" \
          -c user.email="github-actions[bot]@users.noreply.github.com" \
          commit -qm "Docs for ${{ github.event.release.tag_name }}"
        git push -f origin gh-pages-new:gh-pages
