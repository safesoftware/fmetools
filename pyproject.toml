[build-system]
requires = ["setuptools>=75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmetools"
dynamic = ["version"]
description = "Tools for extending Safe Software's FME using Python."
readme = "README.md"
license = "BSD-2-Clause"
authors = [{ name = "Safe Software Inc." }]
keywords = ["FME", "fmeobjects"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/safesoftware/fmetools"
Documentation = "https://docs.safe.com/fme/html/fmetools/"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-recording>=0.13.2",
    "hypothesis>=6.113.0",
    "ruff>=0.14.4",
    "fme-packager>=1.14.0",
]

[tool.setuptools.dynamic]
version = { attr = "fmetools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:Failed to import filter module 'urllib3':pytest.PytestConfigWarning",
    "ignore::urllib3.exceptions.InsecureRequestWarning"
]

[tool.ruff]
required-version = ">=0.14.4"
target-version = "py38"

[tool.ruff.lint]
extend-select = ["FA"]
